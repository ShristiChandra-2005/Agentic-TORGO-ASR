project:
  title: An Explainable, Reproducible, and Speaker-Independent Framework for Dysarthric
    Speech Recognition using Whisper Fine-Tuning, GAN-based Data Augmentation, and
    Agentic AI-based Transcript Refinement
  project_root: E:\AI_Project\Agentic_TORGO_ASR_Project
  data_root: E:\AI_Project\TORGO_DATASET
  seed: 42
  sample_rate: 16000
  created_at: '2026-08-16T21:19:33.275285'
dataset:
  name: TORGO
  audio_extensions:
  - .wav
  - .flac
  - .mp3
  min_duration_seconds: 0.3
  max_duration_seconds: 30.0
  target_sample_rate: 16000
splitting:
  strategy: speaker_independent
  future_loso: true
  validation_size: 0.15
  test_size: 0.15
  random_state: 42
whisper:
  language: en
  task: transcribe
  models:
    tiny: openai/whisper-tiny
    small: openai/whisper-small
  tiny_hp:
    learning_rate: 5.0e-06
    epochs: 3
    batch_size: 1
    gradient_accumulation_steps: 4
    weight_decay: 0.01
    warmup_ratio: 0.05
    fp16: true
    gradient_checkpointing: false
    early_stopping_patience: 3
    early_stopping_threshold: 0.0005
    max_new_tokens: 64
  small_hp:
    learning_rate: 3.0e-06
    epochs: 5
    batch_size: 1
    gradient_accumulation_steps: 8
    weight_decay: 0.01
    warmup_ratio: 0.05
    fp16: true
    gradient_checkpointing: false
    early_stopping_patience: 3
    early_stopping_threshold: 0.0005
    max_new_tokens: 64
gan:
  enabled: true
  purpose: synthetic_data_augmentation
  models:
  - MetricGAN+
  - CMGAN
  epochs: 100
  batch_size: 8
  learning_rate: 0.0002
  quality_metrics:
  - PESQ
  - STOI
  - SNR
  keep_only_high_quality: true
agentic_ai:
  enabled: true
  agents:
  - confidence_agent
  - context_agent
  - verification_agent
evaluation:
  primary_metrics:
  - WER
  - CER
  secondary_metrics:
  - sentence_accuracy
  - inference_time
  - runtime
  - gpu_memory
  - model_size
  test_set_policy: test_only_once_in_final_phase
execution:
  resume: true
  save_checkpoints: true
  clear_cuda_cache: true
  num_workers: 0
  pin_memory: false
  mixed_precision: true
